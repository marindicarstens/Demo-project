name: CI

# Every pull request runs build, unit tests, coverage, dependency and image scans, and the
# Playwright e2e suite against the full Docker Compose stack, which includes the axe-core
# accessibility scan (frontend/e2e/a11y.spec.ts). The slow checks (OWASP ZAP baseline, k6 load
# test) run nightly, on pushes to main, and on manual dispatch.
#
# Every action is pinned to a full commit SHA; the comment after it names the release.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # `verify` runs Spotless, the plain unit tests, the Testcontainers integration tests
      # (including the concurrency and ArchUnit tests), then JaCoCo's 80% line-coverage check
      # (see backend/pom.xml). A formatting or coverage regression fails the build here.
      - name: Build, test, and check coverage
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: npm test -- --watch=false
      # HIGH/CRITICAL advisories fail the build; npm's own severity scale, no extra plugin needed.
      - name: Dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  # OWASP Dependency-Check on the backend's Maven dependencies. It runs through Maven, in the
  # `owasp` profile of backend/pom.xml, so it resolves exactly the dependencies the build uses. It
  # is its own job, and not part of `verify`, so `mvn verify` stays usable offline without NVD
  # access or an API key. Any finding with CVSS 8 or higher fails the job.
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No `cache: maven` here: that cache also covers ~/.m2/repository, and would store the NVD
      # database a second time under a key that never rotates.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "25"
      - name: Compute the NVD cache week
        id: nvd-week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      # One cache per ISO week. A new week starts from the previous week's database, and the scan
      # only downloads what changed since then.
      - name: Cache the NVD vulnerability database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ steps.nvd-week.outputs.week }}
          restore-keys: dependency-check-nvd-
      # NVD_API_KEY is a repo secret (free, from https://nvd.nist.gov/developers/request-an-api-key).
      # An empty value is ignored by the plugin, but on a first-ever run (cache above still empty)
      # this job fails without one: the NVD's anonymous rate limit is strict enough that the
      # plugin's own throttling can still 429 partway through the sync, not just run slowly. Once
      # the cache above is warm, only the delta since the last run needs fetching, so a missing
      # key matters far less on every run after the first.
      - name: Run OWASP Dependency-Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B -Powasp org.owasp:dependency-check-maven:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.html

  # Builds both production images and scans each for HIGH/CRITICAL OS and language-level
  # vulnerabilities. ignore-unfixed: a finding with no released fix can't be acted on, and would
  # fail every run until upstream ships one. Any finding that has a fix still fails the job.
  docker-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build backend image
        run: docker build -t demo-booking-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t demo-booking-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-booking-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: demo-booking-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # A PR gate: once the stack is up the Playwright suite takes seconds, and the stack start-up is
  # the only slow part. It drives the real browser, Nginx proxy, backend, Postgres and Redis, so
  # it catches integration faults that the unit tests can't.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate a local .env
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -base64 24)|" .env
          sed -i "s|^APP_JWT_SIGNING_SECRET=.*|APP_JWT_SIGNING_SECRET=$(openssl rand -base64 32)|" .env
          # Every run from this runner shares one client IP, so lift the general limits. The
          # directory-validation limit stays at its real 5, which the e2e mismatch case exercises.
          {
            echo "APP_RATE_LIMIT_BOOKING_CREATE_MAX_ATTEMPTS=100000"
            echo "APP_RATE_LIMIT_LOOKUP_MAX_ATTEMPTS=100000"
          } >> .env
      - name: Start the full stack
        run: docker compose up --build -d
      # Waits for the backend and for the API through the Nginx proxy, which is the path the
      # browser uses. Fails the job, with the logs, if either isn't up after about 150 seconds.
      - name: Wait for the stack to be healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health \
              && curl -sf -o /dev/null http://localhost:4200/api/v1/branches \
              && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs backend frontend
          exit 1
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the e2e suite
        working-directory: frontend
        run: npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
      - name: Tear down the stack
        if: always()
        run: docker compose down

  # Nightly, main-branch and manual only, not on pull_request: a ZAP scan and a sustained k6 load
  # test each take minutes, and their value is in catching drift over time.
  nightly-security-and-performance:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Generate a local .env
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -base64 24)|" .env
          sed -i "s|^APP_JWT_SIGNING_SECRET=.*|APP_JWT_SIGNING_SECRET=$(openssl rand -base64 32)|" .env
          # k6 and ZAP both come from this one runner IP, so lift every limit - otherwise
          # the k6 booking writes alone exceed 200 per window and fail as 429s.
          {
            echo "APP_RATE_LIMIT_BOOKING_CREATE_MAX_ATTEMPTS=100000"
            echo "APP_RATE_LIMIT_LOOKUP_MAX_ATTEMPTS=100000"
            echo "APP_RATE_LIMIT_DIRECTORY_VALIDATION_MAX_ATTEMPTS=100000"
          } >> .env
      - name: Start the full stack
        run: docker compose up --build -d
      - name: Wait for the stack to be healthy
        run: |
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/actuator/health \
              && curl -sf -o /dev/null http://localhost:4200/api/v1/branches \
              && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs backend frontend
          exit 1
      # zap-baseline exits 2 on any WARN, and fail_action fails the job on it. .zap/rules.tsv
      # marks the reviewed, accepted findings IGNORE, each with its reason.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:4200"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
      # Through the Nginx proxy on :4200, the same path the browser takes. The image is k6 v2.3.0,
      # pinned by its multi-arch index digest like the actions above.
      - name: k6 load test (targets - p95 <300ms read / <500ms write @ 50 req/s)
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:4200/api/v1 \
            -v ${{ github.workspace }}/k6:/scripts \
            grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34 run /scripts/load-test.js
      - name: Tear down the stack
        if: always()
        run: docker compose down
