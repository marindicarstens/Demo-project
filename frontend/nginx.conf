# Hides the nginx version from the Server response header (OWASP ZAP baseline scan finding) -
# doesn't stop fingerprinting outright, but removes the free, zero-effort version disclosure.
server_tokens off;

# Access logs must not collect secrets. The path is logged without its query string: the lookup
# endpoint takes the customer's email as a query parameter. The single-use magic-link token at the
# end of a confirm, cancel or reschedule-confirm path (the app route or its API call) is replaced
# with [redacted], and the Referer, which can carry the same link, is left out. Built from
# $request_uri, the original request, because try_files rewrites $uri to /index.html for app routes.
map $request_uri $log_path {
    "~^(?<token_route>(?:/api/v1)?/(?:confirm|cancel|reschedule-confirm|confirmations|cancellations|reschedule-confirmations)/)[^/?]+" "${token_route}[redacted]";
    "~^(?<path_only>[^?]*)" $path_only;
}
log_format redacted '$remote_addr - [$time_local] "$request_method $log_path $server_protocol" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log redacted;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fingerprinted JS/CSS bundles are safe to cache aggressively; index.html must always
    # be revalidated so a new deploy is picked up on next load.
    location ~* \.(?:js|css|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # The API is served from this same origin, so the browser never makes a cross-origin call.
    # $http_host keeps the client's port, so URLs the backend builds from Host stay correct.
    # X-Forwarded-For is overwritten, not appended: the backend trusts only this proxy's address
    # (server.tomcat.remoteip.internal-proxies), so a client-supplied value must not pass through.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
    }

    # Angular client-side routing: unknown paths fall back to index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
    }
}
