# Security headers (CSP, X-Content-Type-Options, X-Frame-Options, ...) set at the Nginx layer.
# `include`d explicitly in every location block in nginx.conf rather than relying on
# server-level add_header inheritance: nginx silently drops inherited add_header directives for
# any location that sets its own (the static-asset location's Cache-Control) - a real gap the
# OWASP ZAP baseline scan caught live against the running container, not just in theory.
#
# No Strict-Transport-Security here: this demo serves plain HTTP (see README.md's Quick Start) -
# HSTS on a non-HTTPS origin is a no-op at best and actively wrong to send, since it promises a
# guarantee this deployment doesn't keep. A real HTTPS deployment (behind a TLS-terminating
# proxy/load balancer) would add it there.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# connect-src 'self': Nginx proxies /api to the backend (see nginx.conf), so every API call is
# same-origin and no backend origin needs naming here. style-src/font-src name Google Fonts
# explicitly - index.html links fonts.googleapis.com's stylesheet, which in turn references font
# files on fonts.gstatic.com (Poppins/Nunito Sans/Material Icons) - both real breakage caught live
# against the running container (not just theorized) by loading the app under this policy, not
# just passing the ZAP scan that prompted it.
#
# 'unsafe-hashes' + one exact hash (not 'unsafe-inline', which would allow *any* inline handler):
# Angular's production build emits <link ... media="print" onload="this.media='all'"> to defer
# its non-critical stylesheet without blocking first render. Also found by loading the app under
# this policy - the app still renders correctly without it (Angular inlines per-route critical
# CSS), but leaving it silently blocked logs a real violation on every single page load, which
# defeats the point of shipping a CSP that's actually observed rather than just theoretically
# correct. The hash allow-lists this exact, build-tool-generated string - never anything else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
